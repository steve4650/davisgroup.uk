[package]
name = "upload"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
multer = "2"
tower-http = { version = "0.3", features = ["serve"] }
futures-util = "0.3"
sanitize-filename = "0.5"
tracing-subscriber = "0.3"
tracing = "0.1"
